<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 110" width="520" height="110">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="redAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
  </defs>
  
  <!-- Car Silhouette Icon -->
  <g transform="translate(10, 15) scale(0.88)">
    <!-- Wheel arches & body line -->
    <path d="M 15 55 C 30 55, 40 45, 55 45 C 75 45, 85 20, 115 20 C 145 20, 155 35, 175 40 C 190 42, 205 45, 215 55 L 210 65 C 195 62, 185 62, 175 62 C 165 62, 155 75, 135 75 C 115 75, 105 62, 85 62 C 65 62, 55 75, 35 75 C 20 75, 15 65, 15 55 Z" fill="url(#goldGrad)" opacity="0.95" />
    <!-- Sleek Roof line -->
    <path d="M 65 42 Q 100 15 130 18 Q 155 20 170 38" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" />
    <!-- Headlight beam -->
    <polygon points="195,48 225,45 220,55" fill="url(#redAccent)" opacity="0.85" />
    <!-- Wheels -->
    <circle cx="55" cy="65" r="14" fill="#111827" stroke="url(#goldGrad)" stroke-width="3" />
    <circle cx="55" cy="65" r="5" fill="url(#goldGrad)" />
    <circle cx="160" cy="65" r="14" fill="#111827" stroke="url(#goldGrad)" stroke-width="3" />
    <circle cx="160" cy="65" r="5" fill="url(#goldGrad)" />
    <!-- Dynamic Speed lines -->
    <line x1="5" y1="35" x2="35" y2="35" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" opacity="0.6" />
    <line x1="12" y1="45" x2="30" y2="45" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" opacity="0.4" />
  </g>

  <!-- Typography -->
  <text x="205" y="48" font-family="'Plus Jakarta Sans', 'Outfit', 'Segoe UI', Montserrat, sans-serif" font-weight="900" font-size="32" fill="#FFFFFF" letter-spacing="1.5">
    ERROUGA<tspan fill="url(#goldGrad)"> CAR</tspan>
  </text>
  <text x="208" y="70" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-weight="700" font-size="11" fill="#94A3B8" letter-spacing="3">
    LOCATION DE VOITURES
  </text>
  <text x="208" y="87" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-weight="700" font-size="9.5" fill="#F59E0B" letter-spacing="1.5">
    MARRAKECH • CASABLANCA • MAROC
  </text>
</svg>
